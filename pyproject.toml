[project]
name = "pw"
version = "0.1.0"
description = "Property agent workspace — contact/property book plus a scraped market feed"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyturso>=0.7.2",       # Turso/libSQL driver; imported as `turso`
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",          # tier-1 fetcher (mudah.my)
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
pw-api = "pw.api.main:run"
pw-scrape = "pw.scraper.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pw"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
