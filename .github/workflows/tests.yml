name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A second push to a PR supersedes the first — cancel the in-flight run rather
# than paying for both. Keyed on ref, so main and each PR queue independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning. Scoped to the commits this event actually adds rather than
  # the whole history: a full scan re-reports the same historical findings on
  # every run, which trains everyone to ignore the job. `just audit-secrets`
  # runs the full-history scan on demand instead.
  #
  # gitleaks is installed through mise so the version matches mise.toml rather
  # than drifting independently. gitleaks-action is avoided deliberately — it
  # requires a paid licence key for repositories owned by an organisation.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to resolve the base of the range below; the default depth of
          # 1 leaves no history to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Installs only gitleaks out of mise.toml — this job has no use for
          # Node or Python. install_args is silently ignored if tool_versions
          # or mise_toml is also set, so neither is.
          install_args: gitleaks

      # Values reach the script through the environment rather than ${{ }}
      # interpolation, which would splice a branch name straight into the shell.
      - name: Scan pushed commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Branch created by this push, so there is no previous tip to diff
            # against. Scan only its tip commit.
            range="$SHA~1..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          echo "Scanning $range"
          gitleaks git --log-opts="$range" --no-banner --redact --verbose

  # Laravel + Inertia + Svelte. composer ci:check runs pint, eslint,
  # prettier, svelte-check, larastan and pest in one pass.
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # Peck (composer test:spelling) shells out to the aspell binary, which
      # the runner image does not carry. Without this the whole ci:check
      # chain dies at exit 127.
      - name: Install aspell
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Python. Currently the V1 DDL and its behaviour test; the scraper
  # itself is unwritten (SD-7/SQ-6).
  scraper:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/scraper/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest
