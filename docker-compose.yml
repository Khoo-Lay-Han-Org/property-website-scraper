  n8n:
    image: docker.n8n.io/n8nio/n8n:2.31.7   # pin to match the runners image
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
    #   - traefik.http.routers.n8n.tls=true
    #   - traefik.http.routers.n8n.entrypoints=web,websecure
    #   - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
    #   - traefik.http.middlewares.n8n.headers.SSLRedirect=true
    #   - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
    #   - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
    #   - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
    #   - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
    #   - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
    #   - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
    #   - traefik.http.middlewares.n8n.headers.STSPreload=true
    #   - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # - N8N_EMAIL_MODE=smtp
      # - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0   # broker must accept connections from the sidecar
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=true               # enables the Python runner
      
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=${N8N_INSTANCE_OWNER_EMAIL}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_INSTANCE_OWNER_FIRST_NAME}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_INSTANCE_OWNER_LAST_NAME}
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${N8N_INSTANCE_OWNER_PASSWORD_HASH}
      
      # - N8N_PROTOCOL=https  
      # - NODE_ENV=production
      # - N8N_WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      # - N8N_RESTRICT_FILE_ACCESS_TO=/files
      
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      
      # Turso HTTP API credentials
      - DB_TYPE=libsql
      - TURSO_DATABASE_URL=${PUBLIC_TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}

      # Ollama base URL — n8n and Ollama talk over the internal Compose network, using the service name instead of localhost
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    # depends_on:
    #   - ollama

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  task-runners:
    image: n8nio/runners:2.31.7                      # MUST match the n8n version
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=${N8N_RUNNERS_TASK_BROKER_URI}  # service name "n8n" + broker port
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - ./n8n-task-runners.jsonc:/etc/n8n-task-runners.jsonc
    depends_on:
      - n8n

volumes:
  # traefik_data:
  n8n_data:
    external: true
  # ollama_data: